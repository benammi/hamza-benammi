<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hamza Benammi — Senior Software Engineer</title>
    <meta
      name="description"
      content="Senior Software Engineer building backend platforms and AWS serverless systems. Node.js, TypeScript, DynamoDB, CloudFormation. Based in Marrakesh, Morocco."
    />
    <meta property="og:title" content="Hamza Benammi — Senior Software Engineer" />
    <meta
      property="og:description"
      content="Applied AI, automation and cloud backends. 8+ years building SaaS platforms."
    />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#07070b" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
        rel="stylesheet"
      />
    </noscript>
  </head>
  <body>
    <script>
      var d = document.documentElement
      if (!matchMedia("(prefers-reduced-motion: reduce)").matches) d.classList.add("intro")
      if ("scrollRestoration" in history) history.scrollRestoration = "manual"
      var t = null
      try { t = localStorage.getItem("theme") } catch (e) {}
      d.dataset.theme = t === "light" || t === "dark" ? t : matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark"
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
